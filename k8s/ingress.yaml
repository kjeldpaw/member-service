# Plain HTTP via k3s's built-in Traefik ingress controller. Add a TLS section (and e.g.
# cert-manager annotations) once you have a certificate source for this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: member-service
  namespace: member-service
spec:
  ingressClassName: traefik
  rules:
    - host: member-service.k3s.figge.dk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: member-service
                port:
                  name: http
