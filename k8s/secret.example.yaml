# Copy this file to secret.yaml, fill in real values, and apply it:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
#
# k8s/secret.yaml is gitignored (see k8s/.gitignore) so real credentials never get committed.
apiVersion: v1
kind: Secret
metadata:
  name: member-service-secrets
  namespace: member-service
type: Opaque
stringData:
  QUARKUS_DATASOURCE_USERNAME: "member_service"
  QUARKUS_DATASOURCE_PASSWORD: "CHANGE-ME"
  # The "member-service" client's secret in the wandywharang Keycloak realm.
  QUARKUS_KEYCLOAK_ADMIN_CLIENT_CLIENT_SECRET: "CHANGE-ME"
  QUARKUS_OIDC_CREDENTIALS_SECRET: "CHANGE-ME"
