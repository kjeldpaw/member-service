name: Build and publish image

# Pushes to main publish only :<sha>, for testing. Releases come from vX.Y.Z tags (release.yml),
# and nothing publishes :latest (ADR 0001).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-tag: ${{ github.sha }}
