name: Test, build and push image

# Shared by build-and-publish.yml (pushes to main) and release.yml (vX.Y.Z tags).
on:
  workflow_call:
    inputs:
      image-tag:
        description: The one tag to push the image as, e.g. a commit SHA or X.Y.Z.
        required: true
        type: string
      version:
        description: The Gradle project version. Empty means the development default.
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-release-tooling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test release tooling
        # Helm is preinstalled on GitHub's Ubuntu runners; chart-image.test.sh needs it.
        run: |
          ./scripts/release-version.test.sh
          ./scripts/gradle-version.test.sh
          ./scripts/chart-image.test.sh

  build-and-push:
    needs: test-release-tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION_ARG: ${{ inputs.version != '' && format('-Pversion={0}', inputs.version) || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test $VERSION_ARG

      - name: Run integration tests (Testcontainers)
        run: ./gradlew integrationTest $VERSION_ARG

      - name: Build native executable
        # Compiles with a containerized Mandrel/GraalVM builder (quarkus.native.container-build), so
        # the runner only needs Docker, not a local GraalVM install. Tests already ran above.
        # quarkus.package.jar.enabled must be turned off explicitly: it defaults to true, and
        # quarkusBuild refuses to emit both a jar and a native executable in the same build.
        run: ./gradlew build -x test $VERSION_ARG -Dquarkus.native.enabled=true -Dquarkus.native.container-build=true -Dquarkus.package.jar.enabled=false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}
