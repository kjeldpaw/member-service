{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "member-service.fullname" . }}
  labels:
    {{- include "member-service.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ required "ingress.lan.entrypoint is required" .Values.ingress.lan.entrypoint }}
    {{- with omit (.Values.ingress.lan.annotations | default dict) "traefik.ingress.kubernetes.io/router.entrypoints" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tlsSecretName is required" .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "member-service.fullname" . }}
                port:
                  name: http
{{- end }}
