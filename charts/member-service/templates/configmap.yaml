{{- if hasKey .Values.config "QUARKUS_HTTP_CORS_ORIGINS" }}
{{- fail "set cors.allowedOrigin instead of config.QUARKUS_HTTP_CORS_ORIGINS: the chart renders QUARKUS_HTTP_CORS_ORIGINS from cors.allowedOrigin" }}
{{- end }}
{{- $origin := required "cors.allowedOrigin is required" .Values.cors.allowedOrigin }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "member-service.fullname" . }}-config
  labels:
    {{- include "member-service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  QUARKUS_HTTP_CORS_ORIGINS: {{ $origin | quote }}
