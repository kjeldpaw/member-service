apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "member-service.fullname" . }}-config
  labels:
    {{- include "member-service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  QUARKUS_HTTP_CORS_ORIGINS: {{ required "cors.allowedOrigin is required" .Values.cors.allowedOrigin | quote }}
