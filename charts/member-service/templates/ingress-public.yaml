{{- if and .Values.ingress.enabled .Values.ingress.public.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "member-service.fullname" . }}-public
  labels:
    {{- include "member-service.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.public.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "member-service.fullname" . }}
                port:
                  name: http
{{- end }}
