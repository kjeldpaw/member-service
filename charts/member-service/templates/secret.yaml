{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "member-service.secretName" . }}
  labels:
    {{- include "member-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ required (printf "secrets.values.%s is required (or set secrets.existingSecret)" $key) $value | quote }}
  {{- end }}
{{- end }}
