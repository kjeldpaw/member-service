replicaCount: 1

image:
  repository: ghcr.io/kjeldpaw/member-service
  # Defaults to the chart's appVersion, the image released with this chart (ADR 0001). To try an
  # unreleased build from main, set a :<commit-sha> tag, e.g. --set image.tag=$(git rev-parse HEAD).
  tag: ""
  # Release and commit-sha tags never move, so an image already on the node is the right one.
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

containerPort: 8080

# Two Ingresses through k3s's built-in Traefik ingress controller: the LAN one serves the whole app
# (health and OpenAPI included) on the websecure entrypoint, and the public one serves only /api on
# the internet-facing public entrypoint.
ingress:
  enabled: true
  className: traefik
  host: member-service.k3s.figge.dk
  # Both Ingresses serve the host over TLS with this secret. The Certificate that fills it is
  # created on the k3s side.
  tlsSecretName: member-service-tls
  # The LAN Ingress, serving the whole app under /.
  lan:
    # Traefik entrypoint, always rendered as the router.entrypoints annotation.
    entrypoint: websecure
    # Extra annotations. They can't change the entrypoint.
    annotations: {}
  # The public Ingress, serving only /api to the internet.
  public:
    enabled: true
    # Traefik's internet-facing entrypoint, defined on the k3s side. Always rendered as the
    # router.entrypoints annotation, so the API never falls onto Traefik's default (LAN) entrypoints.
    entrypoint: public
    # Extra annotations. They can't change the entrypoint.
    annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

startupProbe:
  httpGet:
    path: /q/health/started
    port: http
  failureThreshold: 30
  periodSeconds: 2
readinessProbe:
  httpGet:
    path: /q/health/ready
    port: http
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /q/health/live
    port: http
  periodSeconds: 20

# Non-sensitive configuration, rendered into a ConfigMap and exposed as environment variables.
# The defaults fit the k3s cluster: the shared Postgres in the postgres namespace, Keycloak at its
# public hostname (so the token issuer matches what Keycloak writes into tokens), and the
# OpenTelemetry collector in the opentelemetry namespace.
config:
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres-postgresql.postgres.svc.cluster.local:5432/member_service"
  QUARKUS_DATASOURCE_REACTIVE_URL: "postgresql://postgres-postgresql.postgres.svc.cluster.local:5432/member_service"
  QUARKUS_OIDC_AUTH_SERVER_URL: "https://keycloak.k3s.figge.dk/realms/wandywharang"
  QUARKUS_OIDC_CLIENT_ID: "member-service"
  QUARKUS_KEYCLOAK_ADMIN_CLIENT_SERVER_URL: "https://keycloak.k3s.figge.dk"
  QUARKUS_KEYCLOAK_ADMIN_CLIENT_REALM: "wandywharang"
  QUARKUS_KEYCLOAK_ADMIN_CLIENT_CLIENT_ID: "member-service"
  QUARKUS_KEYCLOAK_ADMIN_CLIENT_GRANT_TYPE: "CLIENT_CREDENTIALS"
  MEMBER_SERVICE_KEYCLOAK_REALM: "wandywharang"
  QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.opentelemetry.svc.cluster.local:4317"

cors:
  # The one origin browsers may call the API from: the frontend. Rendered as
  # QUARKUS_HTTP_CORS_ORIGINS, so a new frontend host needs only this value, not a new image.
  # Must be one scheme://host[:port] origin: the chart refuses lists, paths and patterns, and
  # refuses QUARKUS_HTTP_CORS_ORIGINS under config.
  allowedOrigin: "https://wandywharang.k3s.figge.dk"

secrets:
  # Name of a pre-existing Secret holding the keys below. When set, the chart does not create one.
  # On the cluster this Secret is supplied from Bitwarden. For a local install, set it to "" and
  # give the values below instead.
  existingSecret: "member-service-secrets"
  # Used only when existingSecret is empty. Supply real values from a gitignored values file
  # (see values.secret.example.yaml) or with --set; never commit them.
  values:
    QUARKUS_DATASOURCE_USERNAME: "member_service"
    QUARKUS_DATASOURCE_PASSWORD: ""
    # The "member-service" client's secret in the wandywharang Keycloak realm.
    QUARKUS_KEYCLOAK_ADMIN_CLIENT_CLIENT_SECRET: ""
    QUARKUS_OIDC_CREDENTIALS_SECRET: ""
