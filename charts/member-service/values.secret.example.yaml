# Copy this file to values.secret.yaml, fill in real values, and pass it to helm:
#   cp charts/member-service/values.secret.example.yaml charts/member-service/values.secret.yaml
#   helm upgrade --install member-service charts/member-service \
#     -n member-service --create-namespace -f charts/member-service/values.secret.yaml
#
# values.secret.yaml is gitignored (see .gitignore in this chart) so real credentials never get committed.
secrets:
  values:
    QUARKUS_DATASOURCE_USERNAME: "member_service"
    QUARKUS_DATASOURCE_PASSWORD: "CHANGE-ME"
    QUARKUS_KEYCLOAK_ADMIN_CLIENT_CLIENT_SECRET: "CHANGE-ME"
    QUARKUS_OIDC_CREDENTIALS_SECRET: "CHANGE-ME"
