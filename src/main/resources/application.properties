# Keycloak Admin Client
# These properties are placeholders and should be configured as per environment
# quarkus.keycloak.admin-client.server-url=http://localhost:8081/auth
# quarkus.keycloak.admin-client.realm=quarkus
# quarkus.keycloak.admin-client.client-id=quarkus-app
# quarkus.keycloak.admin-client.grant-type=client_credentials
# quarkus.keycloak.admin-client.client-secret=secret

# Keycloak Dev Services
quarkus.keycloak.devservices.realm-path=wandywharang-realm.json
# Using default Keycloak Admin Client configuration for Dev Services

# Target realm for member registration
member-service.keycloak.realm=wandywharang

# The member id is the Keycloak user id, so use the token's subject as principal name
quarkus.oidc.token.principal-claim=sub

# Liquibase configuration
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# Hibernate configuration for Reactive Panache
quarkus.hibernate-orm.schema-management.strategy=none

# OpenTelemetry: traces are on by default once the extension is present; metrics are tech-preview
# and need an explicit opt-in. Both ship to the OTLP endpoint (default http://localhost:4317,
# overridden in k8s to point at the in-cluster collector).
quarkus.otel.metrics.enabled=true

# Unit tests mock the services and use @TestSecurity, so they run without Postgres or Keycloak
%test.quarkus.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.liquibase.migrate-at-start=false
%test.quarkus.datasource.username=test
%test.quarkus.datasource.password=test
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/test
%test.quarkus.datasource.reactive.url=postgresql://localhost:5432/test
%test.quarkus.keycloak.admin-client.server-url=http://localhost:8180
%test.quarkus.hibernate-orm.database.version-check.enabled=false
%test.quarkus.otel.sdk.disabled=true

# Integration tests run against real Postgres/Keycloak but there's no OTel collector in that test
# setup, so disable the SDK rather than exporting into the void or triggering an LGTM Dev Service.
%integration.quarkus.otel.sdk.disabled=true
